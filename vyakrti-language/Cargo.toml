[package]
name = "vyakriti"
version = "2026.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Principal Compiler Architect"]

[[bin]]
name = "vy"
path = "src/bin/vy.rs"

[dependencies]
libloading = "0.9"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["memoryapi", "winnt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "compiler_pipeline"
harness = false
